# dusero.com.tr ve www.dusero.com.tr -> https://dusero.com (kalıcı 301 yönlendirme)
# Sunucuda: /etc/nginx/sites-available/dusero-tr
server {
    listen 80;
    listen [::]:80;
    server_name dusero.com.tr www.dusero.com.tr;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://dusero.com$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dusero.com.tr www.dusero.com.tr;
    ssl_certificate /etc/letsencrypt/live/dusero.com.tr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dusero.com.tr/privkey.pem;
    return 301 https://dusero.com$request_uri;
}
