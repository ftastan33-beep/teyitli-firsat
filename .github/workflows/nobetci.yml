# Düşero nöbetçisi: Kasım Fırsatları programı durursa haber verir.
# Her 30 dakikada bir veri.json'un son güncellenme zamanına bakar.
# 45 dakikadan eskiyse:
#   - TELEGRAM_BOT_TOKEN ve TELEGRAM_SAHIP_ID gizli değişkenleri tanımlıysa sahibine Telegram mesajı atar
#     (en fazla 3 saatte bir, sürekli mesaj yağmasın diye)
#   - iş "başarısız" olur; GitHub bu yüzden ayrıca e-posta / GitHub uygulaması bildirimi gönderir
# Program yeniden yayın yapmaya başlayınca bir kez "tekrar çalışıyor" mesajı atar.
name: Nöbetçi

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: nobetci
  cancel-in-progress: false

jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Son güncellemeyi kontrol et
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_ID: ${{ secrets.TELEGRAM_SAHIP_ID }}
          ESIK_DK: "45"
          TEKRAR_DK: "180"
        run: |
          set -euo pipefail
          son=$(gh api "repos/$REPO/commits?path=veri.json&per_page=1" --jq '.[0].commit.committer.date')
          simdi=$(date -u +%s)
          yas=$(( (simdi - $(date -u -d "$son" +%s)) / 60 ))
          son_tr=$(TZ=Europe/Istanbul date -d "$son" '+%d.%m %H:%M')
          echo "Son güncelleme: $son_tr (yaklaşık $yas dk önce)"

          # Önceki çalıştırmanın sonucu: başarısızsa program zaten "durdu" sayılıyordu
          onceki=$(gh api "repos/$REPO/actions/workflows/nobetci.yml/runs?status=completed&per_page=1" \
                   --jq '.workflow_runs[0].conclusion // "yok"' 2>/dev/null || echo yok)

          tg() {
            if [ -n "${TG_TOKEN:-}" ] && [ -n "${TG_ID:-}" ]; then
              curl -sS -o /dev/null -w "Telegram: %{http_code}\n" \
                "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
                --data-urlencode "chat_id=${TG_ID}" --data-urlencode "text=$1" || true
            else
              echo "Telegram gizli değişkenleri tanımlı değil; yalnızca GitHub bildirimi gidecek."
            fi
          }

          if [ "$yas" -ge "$ESIK_DK" ]; then
            sure="$(( yas / 60 )) sa $(( yas % 60 )) dk"
            # İlk fark edişte ve sonra TEKRAR_DK'da bir mesaj at
            if [ "$onceki" != "failure" ] || [ $(( (yas - ESIK_DK) % TEKRAR_DK )) -lt 30 ]; then
              tg "⚠️ Düşero durdu: fırsat listesi $sure süredir güncellenmiyor (son: $son_tr). Ofis bilgisayarında Kasım Fırsatları programının açık olduğunu ve bilgisayarın uykuya geçmediğini kontrol et."
            fi
            echo "::error::Düşero $sure süredir güncellenmiyor (son: $son_tr)"
            exit 1
          fi

          if [ "$onceki" = "failure" ]; then
            tg "✅ Düşero tekrar güncelleniyor (son: $son_tr)."
          fi
          echo "Her şey yolunda."
